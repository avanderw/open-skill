services:
  service:
    build: ./service
    container_name: open-skill-service
    ports:
      - "8080:8080"
    volumes:
      - sqlite-data:/data
    environment:
      OPEN_SKILL_FIREBASE_PROJECT_ID: ${OPEN_SKILL_FIREBASE_PROJECT_ID:?set OPEN_SKILL_FIREBASE_PROJECT_ID}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  app:
    build: ./app
    container_name: open-skill-app
    ports:
      - "5173:80"
    depends_on:
      service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite-data: